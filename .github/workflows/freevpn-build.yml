name: Free VPN build (Linux + Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/busy-tesla-k4f33u"
    paths:
      - "browser/components/freevpn/**"
      - "browser/locales/en-US/browser/freeVpn.ftl"
      - "browser/installer/package-manifest.in"
      - "browser/app/profile/firefox.js"
      - "testing/profiles/unittest-required/user.js"
      - ".github/workflows/freevpn-build.yml"

permissions:
  contents: read

concurrency:
  group: freevpn-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
  MACH_NO_TERMINAL_FOOTER: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MOZCONFIG: ${{ github.workspace }}/browser/components/freevpn/build/mozconfig.linux64
      OBJDIR: obj-freevpn-linux64
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Bootstrap
        run: ./mach --no-interactive bootstrap --application-choice "Firefox for Desktop Artifact Mode"

      - name: Build
        run: ./mach build

      - name: Lint
        run: ./mach lint -l eslint -l fluent-lint -l stylelint browser/components/freevpn browser/locales/en-US/browser/freeVpn.ftl

      - name: xpcshell tests
        run: ./mach xpcshell-test browser/components/freevpn/tests/xpcshell

      - name: Browser tests
        run: xvfb-run -a ./mach mochitest browser/components/freevpn/tests/browser browser/components/genai/tests/browser

      - name: Bundle Tor and uBlock Origin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 browser/components/freevpn/tools/fetch_tor.py --platform linux-x86_64 --dest "$OBJDIR/dist/bin"
          python3 browser/components/freevpn/tools/fetch_ublock.py --dest "$OBJDIR/dist/bin"

      - name: Package
        run: |
          ./mach package
          mkdir -p out
          cp "$OBJDIR"/dist/firefox-*.tar.* out/
          (cd out && for f in firefox-*.tar.*; do mv "$f" "firefox-freevpn-linux-x86_64.tar.${f##*.tar.}"; done && sha256sum * > SHA256SUMS-linux.txt)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firefox-freevpn-linux-x86_64
          path: out/*

  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: C:\mozilla-build\msys2\usr\bin\bash.exe --login -eo pipefail {0}
    env:
      MOZILLABUILD: C:\mozilla-build\
      CHERE_INVOKING: "1"
      MOZCONFIG: browser/components/freevpn/build/mozconfig.win64
      OBJDIR: obj-freevpn-win64
    steps:
      - name: Configure git
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile $env:RUNNER_TEMP\MozillaBuildSetup.exe
          Start-Process -FilePath $env:RUNNER_TEMP\MozillaBuildSetup.exe -ArgumentList '/S' -Wait

      - uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - name: Bootstrap
        run: |
          export PATH="/c/mozilla-build/python3:/c/mozilla-build/bin:$PATH"
          ./mach --no-interactive bootstrap --application-choice "Firefox for Desktop Artifact Mode"

      - name: Build
        run: |
          export PATH="/c/mozilla-build/python3:/c/mozilla-build/bin:$PATH"
          ./mach build

      - name: xpcshell tests
        run: |
          export PATH="/c/mozilla-build/python3:/c/mozilla-build/bin:$PATH"
          ./mach xpcshell-test browser/components/freevpn/tests/xpcshell

      - name: Browser tests
        run: |
          export PATH="/c/mozilla-build/python3:/c/mozilla-build/bin:$PATH"
          ./mach mochitest browser/components/freevpn/tests/browser browser/components/genai/tests/browser

      - name: Bundle Tor and uBlock Origin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH="/c/mozilla-build/python3:/c/mozilla-build/bin:$PATH"
          python3 browser/components/freevpn/tools/fetch_tor.py --platform windows-x86_64 --dest "$OBJDIR/dist/bin"
          python3 browser/components/freevpn/tools/fetch_ublock.py --dest "$OBJDIR/dist/bin"

      - name: Package
        run: |
          export PATH="/c/mozilla-build/python3:/c/mozilla-build/bin:$PATH"
          ./mach package
          mkdir -p out
          cp "$OBJDIR"/dist/firefox-*.win64.zip out/firefox-freevpn-windows-x86_64.zip
          cp "$OBJDIR"/dist/install/sea/firefox-*.win64.installer.exe out/firefox-freevpn-windows-x86_64-setup.exe 2>/dev/null \
            || cp "$OBJDIR"/dist/firefox-*.win64.installer.exe out/firefox-freevpn-windows-x86_64-setup.exe
          (cd out && sha256sum * > SHA256SUMS-windows.txt)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firefox-freevpn-windows-x86_64
          path: out/*

